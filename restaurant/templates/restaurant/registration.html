{% extends "restaurant/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<style>
    .card {
        background-color: #1a1a1a;
        color: #fff;
    }
    .form-control {
        background-color: #2c2c2c;
        color: #fff;
        border: 1px solid #444;
    }
    .form-control:focus {
        background-color: #2c2c2c;
        color: #fff;
        border-color: #666;
        box-shadow: none;
    }
    .form-label {
        color: #ccc;
    }
</style>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4 p-4">
        <h2 class="text-center text-light mb-4">Регистрация</h2>

        <form method="post" action="" class="row g-3">
          {% csrf_token %}
          
          <!-- Login -->
          <div class="col-12">
            <label for="username" class="form-label">Логин</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>

          <!-- Email -->
          <div class="col-12">
            <label for="email" class="form-label">Электронная почта</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <!-- Password -->
          <div class="col-12">
            <label for="password1" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password1" name="password1" required>
          </div>

          <!-- Password Confirmation -->
          <div class="col-12">
            <label for="password2" class="form-label">Подтверждение пароля</label>
            <input type="password" class="form-control" id="password2" name="password2" required>
          </div>

          <!-- Registration Button -->
          <div class="col-12 text-center mt-3">
            <button type="submit" class="btn btn-primary px-5 py-2 shadow-sm">Зарегистрироваться</button>
          </div>

          <!-- Link to login -->
          <div class="col-12 text-center mt-3">
            <p>Уже есть аккаунт? <a href="{% url 'login' %}" class="text-light">Войти</a></p>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
