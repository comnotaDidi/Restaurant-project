{% extends "restaurant/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<style>
    .card {
        background-color: #1a1a1a;
        color: #fff;
    }
    .form-control {
        background-color: #2c2c2c;
        color: #fff;
        border: 1px solid #444;
    }
    .form-control:focus {
        background-color: #2c2c2c;
        color: #fff;
        border-color: #666;
        box-shadow: none;
    }
    .form-label {
        color: #ccc;
    }
</style>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4 p-4">
        <h2 class="text-center text-light mb-4">Вход в систему</h2>

        <form method="post" action="" class="row g-3">
          {% csrf_token %}
          
          <!-- Login -->
          <div class="col-12">
            <label for="username" class="form-label">Логин</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>

          <!-- Password -->
          <div class="col-12">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <!-- Entry Button -->
          <div class="col-12 text-center mt-3">
            <button type="submit" class="btn btn-primary px-5 py-2 shadow-sm">Войти</button>
          </div>

          <!-- Registration Link -->
          <div class="col-12 text-center mt-3">
            <p>Нет аккаунта? <a href="{% url 'registration' %}" class="text-light">Зарегистрироваться</a></p>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
