<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан</title>
    <!-- Подключение Bootstrap и темы Bootswatch -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/cerulean/bootstrap.min.css">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="bg-primary p-3">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Ресторан</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'menu' %}">Меню</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'gallery' %}">Галерея</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'contacts' %}">Контакты</a></li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'submit_review' %}">Оставить отзыв</a>
                        </li>
                          
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container text-center mt-5">
        <div class="jumbotron p-5 bg-light rounded">
            <h1 class="display-4">Добро пожаловать в наш ресторан</h1>
            <p class="lead">Лучшие блюда и уютная атмосфера для вас</p>
            <div class="buttons mt-4">
                <a href="{% url 'reservation' %}" class="btn btn-primary">Забронировать столик</a>

                <a href="{% url 'menu' %}" class="btn btn-outline-secondary">Посмотреть меню</a>
            </div>
            
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>© 2025 Ресторан. Все права защищены.</p>
    </footer>

    <!-- Подключение Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
