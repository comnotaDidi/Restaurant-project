{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/cerulean/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="bg-primary p-3">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">Ресторан</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'gallery' %}">Галерея</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'contacts' %}">Контакты</a></li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'submit_review' %}">Оставить отзыв</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5">
        <h1 class="text-center">Наше меню</h1>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" >
                <div class="card h-100">
                    <img src="{% static 'image/3.jpg' %}" class="card-img-top" alt="Блюдо 1">
                    <div class="card-body">
                        <h3 class="card-title">Блюдо 1</h3>
                        <p class="card-text">Описание блюда</p>
                        <span class="fw-bold">Цена: 40zł</span>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <img src="{% static 'image/4.jpg' %}" class="card-img-top" alt="Блюдо 2">
                    <div class="card-body">
                        <h3 class="card-title">Блюдо 2</h3>
                        <p class="card-text">Описание блюда</p>
                        <span class="fw-bold">Цена: 60zł</span>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <img src="{% static 'image/5.jpg' %}" class="card-img-top" alt="Блюдо 3">
                    <div class="card-body">
                        <h3 class="card-title">Блюдо 3</h3>
                        <p class="card-text">Описание блюда</p>
                        <span class="fw-bold">Цена: 50zł</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>© 2025 Ресторан. Все права защищены.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
