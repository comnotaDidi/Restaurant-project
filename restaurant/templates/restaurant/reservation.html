{% extends "restaurant/base.html" %}

{% block title %}Бронирование столика{% endblock %}

{% block content %}
<style>
    .card {
        background-color: #1a1a1a; /* Тёмный фон формы */
        color: #fff;
    }
    .form-control {
        background-color: #2c2c2c;
        color: #fff;
        border: 1px solid #444;
    }
    .form-control:focus {
        background-color: #2c2c2c;
        color: #fff;
        border-color: #666;
        box-shadow: none;
    }
    .form-label {
        color: #ccc;
    }
</style>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4 p-4">
        <h2 class="text-center text-light mb-4">Забронировать столик</h2>

        <form method="post" action="" class="row g-3">
          {% csrf_token %}
          <div class="col-md-6">
            <label for="name" class="form-label">Имя</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="col-md-6">
            <label for="date" class="form-label">Дата</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>

          <div class="col-md-6">
            <label for="time" class="form-label">Время</label>
            <input type="time" class="form-control" id="time" name="time" required>
          </div>

          <div class="col-12">
            <label for="guests" class="form-label">Количество гостей</label>
            <input type="number" class="form-control" id="guests" name="guests" min="1" required>
          </div>

          <div class="col-12">
            <label for="message" class="form-label">Комментарий</label>
            <textarea class="form-control" id="message" name="message" rows="3"></textarea>
          </div>

          <div class="col-12 text-center mt-3">
            <button type="submit" class="btn btn-primary px-5 py-2 shadow-sm">Отправить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
