<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ресторан{% endblock %}</title>
    
    <!-- Bootstrap + Bootswatch Cerulean -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/cerulean/bootstrap.min.css">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- 🔷 Изменили цвет шапки на голубой -->
    <header class="bg-primary p-3">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Ресторан</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a href="/" class="nav-link text-white">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'gallery' %}">Галерея</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'contacts' %}">Контакты</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'submit_review' %}">Оставить отзыв</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Контент страницы -->
    {% block content %}
    {% endblock %}

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>© 2025 Ресторан. Все права защищены.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
